<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%234bf5ff'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234bf5ff' stroke-width='2' opacity='0.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>

  <header class="hud-header">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="status" id="status-text">SYSTEM ONLINE</div>
  </header>

  <main class="hud-stage">
    <canvas id="hud-canvas"></canvas>
    <div class="core-label" id="core-label">STANDBY</div>
  </main>

  <div class="telemetry telemetry-left">
    <div class="telemetry-row"><span>PWR</span><span id="tlm-pwr">--</span></div>
    <div class="telemetry-row"><span>FREQ</span><span id="tlm-freq">--</span></div>
    <div class="telemetry-row"><span>SYNC</span><span id="tlm-sync">--</span></div>
  </div>

  <div class="telemetry telemetry-right">
    <div class="telemetry-row"><span>LAT</span><span id="tlm-lat">--</span></div>
    <div class="telemetry-row"><span>NET</span><span id="tlm-net">--</span></div>
    <div class="telemetry-row"><span>TEMP</span><span id="tlm-temp">--</span></div>
  </div>

  <footer class="hud-footer">
    <button id="mic-toggle" class="mic-btn">ATTIVA MICROFONO</button>
    <div class="hint">Senza microfono l'HUD respira in modalit&agrave; simulata</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
